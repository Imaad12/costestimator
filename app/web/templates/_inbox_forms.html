{% macro opform(o, nxt, cls='') %}<form class="inline opform{{ " is-reject" if cls and "danger" in cls else "" }}" method="post" action="/ui/do/{{ o.action }}"{% if o.label.startswith('Approve') or o.label in ('Accept','Publish as rate') %} data-confirm="{{ o.label }}? This is recorded in the audit trail under your name."{% endif %}>
<input type="hidden" name="_next" value="{{ nxt }}">{% for k, v in o.fields.items() %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
{% for inp in o.inputs %}{% if inp|length > 3 %}<select name="{{ inp[0] }}" {{ 'required' if inp[2] else '' }}><option value="">{{ inp[1] }}</option>{% for c in inp[3] %}<option value="{{ c }}">{{ 'Prices exclude VAT' if c == 'Excluded' else ('Prices include VAT' if c == 'Included' else c) }}</option>{% endfor %}</select>{% else %}<input name="{{ inp[0] }}" placeholder="{{ inp[1] }}" {{ 'required' if inp[2] else '' }} size="26">{% endif %}{% endfor %}<button class="{{ cls }}">{{ o.label }}</button></form>{% endmacro %}
